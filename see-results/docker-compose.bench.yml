services:
  backend:
    build:
      context: ..
      dockerfile_inline: |
        FROM gradle:9.5.1-jdk25-alpine
        RUN apk add --no-cache libstdc++ libgcc libarchive
        RUN ln -s /usr/lib/libarchive.so.13 /usr/lib/libarchive.so
    command: sh -c "cd /backend && ./gradlew bootRun --no-daemon -Dorg.gradle.jvmargs='-Xmx2g -XX:MaxMetaspaceSize=512m'"
    ports:
      - "${BACKEND_PORT:-6060}:6060"
      - "127.0.0.1:${REMOTE_DEBUG_PORT:-5005}:5005"
    environment:
      - DATABASE_URL=jdbc:mariadb://backend_db:3306/grimmory
      - DATABASE_USERNAME=grimmory
      - DATABASE_PASSWORD=grimmory
      - GRADLE_USER_HOME=/home/gradle/.gradle
      - XDG_CACHE_HOME=/home/gradle/.cache
      - REMOTE_DEBUG_ENABLED=false
      - ALLOWED_ORIGINS=*
      - API_DOCS_ENABLED=true
      - JAVA_OPTS=-XX:+UseShenandoahGC -XX:ShenandoahGCHeuristics=compact -XX:+UseCompactObjectHeaders -XX:MaxRAMPercentage=60.0 -XX:InitialRAMPercentage=8.0 -XX:+ExitOnOutOfMemoryError -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/heapdump.hprof -XX:MaxMetaspaceSize=256m -XX:ReservedCodeCacheSize=48m -Xss512k -XX:CICompilerCount=2 -XX:+UnlockExperimentalVMOptions -XX:+UseStringDeduplication -XX:ShenandoahUncommitDelay=5000 -XX:ShenandoahGuaranteedGCInterval=30000 -XX:MaxDirectMemorySize=256m --enable-native-access=ALL-UNNAMED --enable-preview
    stdin_open: true
    tty: true
    restart: always
    depends_on:
      backend_db:
        condition: service_healthy
    networks:
      - bench_net
    volumes:
      - '../backend:/backend'
      - backend_build:/backend/build
      - backend_gradle_cache:/home/gradle/.gradle
      - backend_native_cache:/home/gradle/.cache
      - ../shared/data:/app/data
      - ../shared/books:/books
      - ../shared/bookdrop:/bookdrop
  backend_db:
    image: mariadb:11.4
    volumes:
      - backend_db:/var/lib/mysql
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=grimmory
      - MYSQL_DATABASE=grimmory
      - MYSQL_USER=grimmory
      - MYSQL_PASSWORD=grimmory
    ports:
      - "${DB_PORT:-3366}:3306"
    networks:
      bench_net:
        aliases:
          - backend_db
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-uroot", "-pgrimmory"]
      interval: 10s
      timeout: 5s
      retries: 5
networks:
  bench_net:
    driver: bridge
volumes:
  backend_db:
  backend_build:
  backend_gradle_cache:
  backend_native_cache: