spring:
  application:
    name: grimmory-benchmark

  main:
    web-application-type: servlet

  datasource:
    url: ${DATABASE_URL:jdbc:mariadb://localhost:3306/grimmory}
    username: ${DB_USER:grimmory}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false

server:
  port: 0

logging:
  level:
    root: WARN
    org.booklore: WARN

# BookLore
api:
  docs:
    enabled: ${API_DOCS_ENABLED:false}
